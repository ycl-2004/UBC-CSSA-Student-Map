<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8262c">
  <title>UBC CSSA · 大温手绘风真实会员福利地图</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <main class="page">
    <!-- Header -->
    <header class="site-header">
      <div class="brand-wrap">
        <div class="seal-badge" aria-hidden="true">联</div>
        <div class="brand-info">
          <h1>UBC CSSA <span class="brand-title-desktop">会员专属地图</span><span class="brand-title-mobile">福利地图</span><span class="brand-flower" aria-hidden="true">✿</span></h1>
          <div class="tagline">
            <span>下课后，一起探索有优惠的小店</span>
            <span class="pill">★ 2026-2027 专属权益</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="btnHowToCard" type="button" aria-label="会员卡说明">
          <span>💳</span><span class="btn-text">会员卡说明</span>
        </button>
        <button class="header-btn primary" id="btnSuggest" type="button" aria-label="推荐合作店">
          <span>✎</span><span class="btn-text">推荐合作店</span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <section class="app-main">
      <!-- Sidebar / Mobile Bottom Sheet -->
      <aside class="sidebar" id="sidebarSheet" aria-label="合作商家与筛选">
        <!-- Mobile Drawer Drag Handle -->
        <button class="drawer-handle-bar" id="drawerHandle" type="button" aria-expanded="false" aria-controls="sidebarBody">
          <span class="drawer-pill" aria-hidden="true"></span>
          <span class="drawer-status-hint" id="drawerToggleText">展开商家列表</span>
        </button>

        <div class="sidebar-header">
          <label class="search-bar">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search" id="searchInput" placeholder="搜店名、区域或优惠" aria-label="搜索店名、英文名、区域、类型或优惠">
          </label>
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel">筛选</button>
        </div>

        <div class="sidebar-body" id="sidebarBody">
        <div class="filter-panel" id="filterPanel">
        <!-- Filter 1: Categories -->
        <div class="filter-section">
          <div class="filter-label">
            <span>按类型筛选</span>
            <span class="filter-status" id="activeCategoryHint">全部类型</span>
          </div>
          <div class="chip-scroll" role="group" aria-label="分类筛选">
            <button class="filter-chip" type="button" data-cat="all" aria-pressed="true">✨ 全部</button>
            <button class="filter-chip" type="button" data-cat="food" aria-pressed="false">🍜 美食正餐</button>
            <button class="filter-chip" type="button" data-cat="drink" aria-pressed="false">🧋 奶茶甜点</button>
            <button class="filter-chip" type="button" data-cat="fun" aria-pressed="false">🎟️ 玩乐KTV</button>
            <button class="filter-chip" type="button" data-cat="life" aria-pressed="false">🛍️ 生活日常</button>
          </div>
        </div>

        <!-- Filter 2: Areas -->
        <div class="filter-section">
          <div class="filter-label">
            <span>按大温商圈</span>
          </div>
          <div class="chip-scroll" role="group" aria-label="区域筛选">
            <button class="filter-chip" type="button" data-area="all" aria-pressed="true">所有店铺</button>
            <button class="filter-chip" type="button" data-area="ubc" aria-pressed="false">🌲 UBC 校区</button>
            <button class="filter-chip" type="button" data-area="downtown" aria-pressed="false">🌇 Downtown</button>
            <button class="filter-chip" type="button" data-area="vancouver" aria-pressed="false">🏡 Vancouver</button>
            <button class="filter-chip" type="button" data-area="richmond" aria-pressed="false">🥟 Richmond</button>
            <button class="filter-chip" type="button" data-area="burnaby" aria-pressed="false">🛍️ Burnaby</button>
            <button class="filter-chip" type="button" data-area="outer" aria-pressed="false">🗺️ 其他大温</button>
          </div>
        </div>

        </div>
        <!-- Result Stats -->
        <div class="list-meta">
          <span>共找到 <strong id="partnerCount">0</strong> 家 CSSA 合作小店</span>
          <span class="list-caption">优惠仅限到店</span>
        </div>

        <!-- Scrollable Cards -->
        <div class="partner-scroll" id="partnerList" aria-label="商家搜索结果"></div>
        </div>
      </aside>

      <!-- Map Stage with Leaflet Real Metro Vancouver Map -->
      <div class="map-stage" id="mapStage" aria-label="大温真实地图画布">
        <!-- Real Leaflet Map Container -->
        <div id="leafletMap"></div>
        <p class="map-unavailable" id="mapUnavailable" hidden>地图暂时无法加载，请稍后刷新。你仍可搜索店铺、查看优惠与导航地址。</p>

        <!-- Quick Area Jump Pills -->
        <div class="area-quick-bar">
          <div class="quick-title"><span>✦</span> 飞向区域</div>
          <button class="quick-jump-btn" type="button" data-jump="core">✦ 核心商圈</button>
          <button class="quick-jump-btn ubc-pill" type="button" data-jump="ubc">🌲 UBC 本部</button>
          <button class="quick-jump-btn" type="button" data-jump="downtown">🌇 Downtown</button>
          <button class="quick-jump-btn" type="button" data-jump="vancouver">🏡 Vancouver</button>
          <button class="quick-jump-btn" type="button" data-jump="richmond">🥟 Richmond</button>
          <button class="quick-jump-btn" type="button" data-jump="burnaby">🛍️ Burnaby</button>
          <button class="quick-jump-btn" type="button" data-jump="outer">🗺️ 其他大温</button>
          <button class="quick-jump-btn" type="button" data-jump="all">🌐 全部店铺</button>
        </div>

        <!-- Map Controls -->
        <div class="map-controls">
          <button class="ctrl-btn" id="btnZoomIn" type="button" aria-label="放大地图">+</button>
          <button class="ctrl-btn" id="btnZoomOut" type="button" aria-label="缩小地图">−</button>
          <button class="ctrl-btn" id="btnResetView" type="button" aria-label="复位地图" title="复位视角">⟲</button>
        </div>

        <div class="map-stamp" aria-hidden="true"><span class="stamp-flower">✿</span><span>UBC CSSA<small>下课，去逛逛！</small></span></div>

        <!-- Bottom Left Hint Pill -->
        <div class="map-hint-pill">
          <span>✦ CSSA 分类</span>
          <span class="map-legend-item"><i class="map-legend-dot food"></i>美食</span>
          <span class="map-legend-item"><i class="map-legend-dot drink"></i>饮品</span>
          <span class="map-legend-item"><i class="map-legend-dot fun"></i>玩乐</span>
          <span class="map-legend-item"><i class="map-legend-dot life"></i>生活</span>
        </div>
      </div>

      <dialog class="detail-card" id="detailCard" aria-labelledby="cardName">
        <header class="detail-header">
          <div class="detail-large-icon" id="cardIcon" aria-hidden="true"></div>
          <div class="detail-title-wrap"><div class="detail-eyebrow">CSSA 会员福利</div><h2 class="detail-name" id="cardName"></h2></div>
          <button class="close-card-btn" id="btnCloseDetail" type="button" aria-label="关闭详情，返回地图或商家列表" autofocus>×</button>
        </header>
        <div class="detail-body" id="detailBody" tabindex="0" aria-label="地址与完整优惠">
          <p class="detail-location-str" id="cardArea"></p>
          <div class="detail-perk-box"><div class="perk-box-title">会员专属优惠</div><div class="perk-box-value" id="cardPerk"></div></div>
          <div class="detail-tags" id="cardTags"></div>
        </div>
        <footer class="detail-actions-row">
          <button class="detail-btn map-view" id="btnViewOnMap" type="button">🗺️ 在地图上看</button>
          <button class="detail-btn sub" id="btnNavMaps" type="button">📍 导航路线</button>
          <a class="detail-btn main" id="shopLink" target="_blank" rel="noopener noreferrer">店铺链接 ↗</a>
        </footer>
      </dialog>
    </section>
  </main>

  <noscript>此地图需要启用 JavaScript 才能搜索商家和查看优惠。</noscript>

  <!-- Global Toast -->
  <div class="app-toast" id="appToast" role="status" aria-live="polite">提示信息</div>

  <!-- Leaflet JS -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script defer src="./src/namespace.js"></script>
  <script defer src="./src/data/partners.js"></script>
  <script defer src="./src/data/map-config.js"></script>
  <script defer src="./src/search.js"></script>
  <script defer src="./src/ui/dom.js"></script>
  <script defer src="./src/marker-icons.js"></script>
  <script defer src="./src/map.js"></script>
  <script defer src="./src/ui/partner-list.js"></script>
  <script defer src="./src/ui/detail-panel.js"></script>
  <script defer src="./src/app.js"></script>
</body>
</html>
