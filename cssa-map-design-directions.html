<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8262c">
  <title>UBC CSSA · 大温手绘风真实会员福利地图</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --cssa-red: #d8262c;
      --cssa-red-dark: #9f161b;
      --cssa-red-light: #fff0f1;
      --ubc-blue: #002145;
      --ubc-blue-light: #e8eff7;
      --gold: #f5a623;
      --gold-dark: #b87408;
      --gold-light: #fff7e6;
      --ink: #3c2f2d;
      --ink-soft: #63524e;
      --muted: #8c7a74;
      --paper: #fffefb;
      --paper-cream: #faf4ea;
      --border-warm: #ebdccb;
      --sea: #d8ebe8;
      --shadow-sm: 0 3px 8px rgba(74, 43, 34, 0.08);
      --shadow-md: 0 12px 28px rgba(74, 43, 34, 0.14);
      --shadow-stamp: 2px 3px 0 rgba(159, 22, 27, 0.2);
      --font-rounded: ui-rounded, "Hiragino Maru Gothic ProN", "PingFang SC Rounded", "M PLUS Rounded 1c", "YouYuan", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      color: var(--ink);
      background: #f7f1e6;
      background-image: radial-gradient(rgba(145, 107, 85, 0.07) 1px, transparent 1px);
      background-size: 10px 10px;
      font-family: var(--font-rounded);
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input { font-family: inherit; }
    button { cursor: pointer; border: 0; background: none; }

    /* Page Layout */
    .page {
      max-width: 1560px;
      margin: 0 auto;
      padding: 14px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Site Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--paper);
      padding: 12px 18px;
      border: 2px solid var(--border-warm);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .seal-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px 14px 11px 15px;
      background: var(--cssa-red);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 900;
      box-shadow: var(--shadow-stamp);
      transform: rotate(-3deg);
      border: 2px solid #fff;
      position: relative;
    }
    .seal-badge:after {
      content: "UBC";
      position: absolute;
      bottom: -6px;
      right: -6px;
      font-size: 8px;
      background: var(--ubc-blue);
      color: #fff;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid #fff;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-info h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      color: var(--cssa-red-dark);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-info .tagline {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-info .tagline span.pill {
      background: var(--gold-light);
      color: var(--gold-dark);
      border: 1px solid var(--gold);
      padding: 1px 6px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--cssa-red);
      background: #fff;
      color: var(--cssa-red);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      box-shadow: 1px 2px 0 rgba(216, 38, 44, 0.15);
    }
    .header-btn:hover {
      background: var(--cssa-red);
      color: #fff;
      transform: translateY(-1px);
    }
    .header-btn.primary {
      background: var(--cssa-red);
      color: #fff;
    }
    .header-btn.primary:hover {
      background: var(--cssa-red-dark);
    }

    /* Main Container (Desktop Side by Side) */
    .app-main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      min-height: 520px;
      height: min(780px, calc(100dvh - 136px));
    }

    /* Left Sidebar */
    .sidebar {
      background: var(--paper);
      border: 2px solid var(--border-warm);
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 2px dashed var(--border-warm);
      background: #fffdf9;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1.5px solid var(--border-warm);
      border-radius: 14px;
      padding: 9px 12px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
      transition: border-color 0.2s;
    }
    .search-bar:focus-within {
      border-color: var(--cssa-red);
      box-shadow: 0 0 0 3px rgba(216, 38, 44, 0.12);
    }
    .search-bar input {
      border: 0;
      outline: 0;
      font-size: 12px;
      color: var(--ink);
      width: 100%;
      background: transparent;
    }
    .search-bar input::placeholder { color: #b09e96; }

    /* Filter Section */
    .filter-section {
      padding: 11px 18px 7px;
      border-bottom: 1px dashed var(--border-warm);
      background: var(--paper-cream);
    }
    .filter-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chip-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-chip {
      padding: 5px 10px;
      border-radius: 10px 14px 11px 13px;
      border: 1.5px solid var(--border-warm);
      background: #fff;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 750;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .filter-chip:hover {
      border-color: var(--cssa-red);
      transform: translateY(-1px);
    }
    .filter-chip[aria-pressed="true"] {
      background: var(--cssa-red);
      color: #fff;
      border-color: var(--cssa-red-dark);
      box-shadow: var(--shadow-stamp);
      transform: rotate(-1deg);
    }

    /* Partner List */
    .list-meta {
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      background: #fff;
    }
    .list-meta strong {
      color: var(--cssa-red-dark);
      font-size: 12px;
      font-weight: 850;
    }

    .partner-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .partner-scroll::-webkit-scrollbar { width: 5px; }
    .partner-scroll::-webkit-scrollbar-thumb { background: #dfcebd; border-radius: 99px; }

    .partner-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1.5px solid var(--border-warm);
      border-radius: 16px;
      text-align: left;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.4, 1);
      position: relative;
    }
    .partner-card:hover {
      border-color: #e8a9a4;
      background: var(--cssa-red-light);
      transform: translateX(3px);
    }
    .partner-card.active {
      border-color: var(--cssa-red);
      background: #fff7f7;
      box-shadow: 0 4px 14px rgba(216, 38, 44, 0.15);
      border-left: 5px solid var(--cssa-red);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: #fff4e8;
      border: 1.5px solid #f0dec9;
      flex-shrink: 0;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-info .name {
      font-size: 13px;
      font-weight: 850;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-info .sub {
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-area {
      background: #f1ebd9;
      color: #6d5b51;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
    }
    .card-perk {
      flex-shrink: 0;
      padding: 4px 8px;
      background: var(--gold-light);
      border: 1.5px dashed var(--gold);
      border-radius: 8px;
      color: var(--gold-dark);
      font-size: 10px;
      font-weight: 900;
      transform: rotate(-1.5deg);
    }

    /* Map Stage (Real Leaflet Map with Watercolor/Paper Filter) */
    .map-stage {
      position: relative;
      border: 2px solid var(--border-warm);
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    #leafletMap {
      width: 100%;
      height: 100%;
      background: var(--sea);
      z-index: 1;
    }

    /* Watercolor / Warm Paper Map Tile Filter */
    .leaflet-tile-pane {
      filter: sepia(0.24) saturate(1.2) hue-rotate(-10deg) contrast(0.97) brightness(1.02);
    }

    /* Subtle Paper Texture Overlay on Top of Map */
    .map-paper-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(145, 107, 85, 0.04) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
      z-index: 400;
    }

    /* Quick Area Jump Tabs (UBC, Van, Richmond, Burnaby) */
    .area-quick-bar {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.95);
      padding: 6px;
      border-radius: 16px;
      border: 1.5px solid var(--border-warm);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }
    .quick-title {
      font-size: 10px;
      font-weight: 850;
      color: var(--cssa-red-dark);
      padding: 0 6px;
      border-right: 1px dashed var(--border-warm);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .quick-jump-btn {
      padding: 5px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-soft);
      background: #fff;
      border: 1px solid var(--border-warm);
      transition: all 0.16s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .quick-jump-btn:hover {
      background: var(--cssa-red-light);
      border-color: var(--cssa-red);
      color: var(--cssa-red);
    }
    .quick-jump-btn.ubc-pill {
      background: var(--ubc-blue-light);
      color: var(--ubc-blue);
      border-color: #bed0e6;
    }
    .quick-jump-btn.ubc-pill:hover {
      background: var(--ubc-blue);
      color: #fff;
    }

    /* Map Controls (Top Right) */
    .map-controls {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--paper);
      border: 2px solid var(--border-warm);
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover {
      background: var(--cssa-red-light);
      border-color: var(--cssa-red);
      color: var(--cssa-red);
      transform: scale(1.05);
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }

    /* Custom Leaflet Sticker Marker Styles */
    .custom-leaflet-marker {
      background: transparent !important;
      border: none !important;
    }

    .merchant-sticker-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -100%);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .merchant-sticker-pin:hover {
      transform: translate(-50%, -105%) scale(1.1);
    }
    .merchant-sticker-pin.active {
      transform: translate(-50%, -108%) scale(1.18);
      z-index: 9999 !important;
    }

    .pin-bubble {
      background: #fff;
      border: 2.5px solid #fff;
      border-radius: 18px 20px 17px 22px;
      box-shadow: 0 4px 10px rgba(60, 30, 20, 0.18), 0 1px 2px rgba(60, 30, 20, 0.08);
      padding: 4px;
      position: relative;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }
    .merchant-sticker-pin.active .pin-bubble {
      border-color: var(--cssa-red);
      box-shadow: 0 0 0 3px rgba(216, 38, 44, 0.25), 0 8px 18px rgba(216, 38, 44, 0.2);
      animation: sticker-bounce 0.4s ease;
    }

    .pin-icon {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: var(--paper-cream);
    }
    .merchant-sticker-pin.active .pin-icon {
      background: var(--cssa-red-light);
    }

    .pin-tail {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #fff;
      margin-top: -1px;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,0.1));
    }
    .merchant-sticker-pin.active .pin-tail {
      border-top-color: var(--cssa-red);
    }

    .pin-caption {
      margin-top: 3px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      font-size: 10px;
      font-weight: 850;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-warm);
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      pointer-events: none;
    }
    .merchant-sticker-pin.active .pin-caption {
      background: var(--cssa-red);
      color: #fff;
      border-color: var(--cssa-red-dark);
    }

    .pin-sparkle {
      position: absolute;
      top: -8px;
      right: -8px;
      font-size: 14px;
      display: none;
    }
    .merchant-sticker-pin.active .pin-sparkle {
      display: block;
      animation: spin-pulse 1.2s infinite alternate;
    }

    /* Cute Landmark Badges on Map */
    .landmark-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-warm);
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 850;
      color: var(--ink-soft);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      white-space: nowrap;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .landmark-badge.ubc {
      background: var(--ubc-blue);
      color: #fff;
      border: 2px solid #fff;
      font-size: 11px;
      transform: translate(-50%, -50%) rotate(-2deg);
      box-shadow: 0 4px 12px rgba(0, 33, 69, 0.3);
    }

    @keyframes sticker-bounce {
      0% { transform: scale(0.8) rotate(-6deg); }
      60% { transform: scale(1.15) rotate(4deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes spin-pulse {
      0% { transform: scale(0.9) rotate(-10deg); }
      100% { transform: scale(1.2) rotate(15deg); }
    }

    /* Detail Modal / Floating Card on Desktop */
    .detail-card {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 320px;
      background: var(--paper);
      border: 2px solid var(--border-warm);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 16px;
      z-index: 600;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.18, 0.84, 0.28, 1.1);
    }
    .detail-card.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }
    .detail-large-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: var(--cssa-red-light);
      border: 2px solid #fedbdc;
      flex-shrink: 0;
    }
    .detail-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .detail-eyebrow {
      font-size: 9px;
      font-weight: 850;
      color: var(--cssa-red);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .detail-name {
      margin: 2px 0 3px;
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
    }
    .detail-location-str {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .close-card-btn {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid var(--border-warm);
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }
    .close-card-btn:hover {
      background: var(--cssa-red-light);
      color: var(--cssa-red);
    }

    .detail-perk-box {
      margin: 12px 0 10px;
      padding: 10px 12px;
      background: var(--gold-light);
      border: 1.5px dashed var(--gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .perk-box-title {
      font-size: 10px;
      color: var(--gold-dark);
      font-weight: 800;
    }
    .perk-box-sub {
      font-size: 9px;
      color: #92692e;
      margin-top: 1px;
    }
    .perk-box-value {
      font-size: 17px;
      font-weight: 900;
      color: var(--cssa-red-dark);
      letter-spacing: 0.02em;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }
    .tag-badge {
      background: #f4ede4;
      color: var(--ink-soft);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 750;
    }

    .detail-desc {
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink-soft);
      margin: 0 0 12px;
    }

    .detail-actions-row {
      display: flex;
      gap: 8px;
    }
    .detail-btn {
      flex: 1;
      padding: 9px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 850;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.16s ease;
    }
    .detail-btn.sub {
      background: #fff;
      border: 1.5px solid var(--border-warm);
      color: var(--ink-soft);
    }
    .detail-btn.sub:hover {
      border-color: var(--cssa-red);
      color: var(--cssa-red);
    }
    .detail-btn.main {
      background: var(--cssa-red);
      color: #fff;
      border: 1.5px solid var(--cssa-red-dark);
      box-shadow: 0 2px 6px rgba(216, 38, 44, 0.25);
    }
    .detail-btn.main:hover {
      background: var(--cssa-red-dark);
    }

    /* Map Navigation Hint Pill */
    .map-hint-pill {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 500;
      background: rgba(255, 253, 248, 0.94);
      border: 1.5px dashed var(--border-warm);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 11px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(4px);
    }
    .map-hint-pill b { color: var(--cssa-red); }

    /* Toast Notification */
    .app-toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translate(-50%, 20px);
      background: var(--cssa-red-dark);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(159, 22, 27, 0.3);
      border: 2px solid #fff;
      opacity: 0;

    /* Hide Leaflet Default UI clutter */

    @media (min-width: 861px) {

    /* Readability and map-first visual refresh */
    :root {

    body {

    .site-header { padding: 14px 20px; border-width: 1px; border-radius: 18px; }

    .header-btn { font-size: 13px; font-weight: 700; padding: 9px 14px; box-shadow: none; }

    .filter-label { font-size: 12px; letter-spacing: 0; }

    .partner-scroll { padding: 12px; gap: 8px; }
    .partner-card {
      display: grid;

      grid-template-rows: auto auto;
      align-content: start;

    .partner-card[data-category="drink"] .card-icon { background: #e8f5f1; border-color: #c5e4da; }
    .partner-card[data-category="fun"] .card-icon { background: #f0edff; border-color: #d7d0f4; }
    .partner-card[data-category="life"] .card-icon { background: #fff4dc; border-color: #efddb0; }
    .card-info .name { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .card-info .sub { margin-top: 4px; font-size: 12px; line-height: 1.25; }

    .card-perk {
      grid-column: 2;
      grid-row: 2;
      justify-self: start;
      align-self: start;
      width: fit-content;
      max-width: 100%;

      overflow: hidden;
      text-overflow: ellipsis;

      white-space: normal;
      overflow-wrap: anywhere;

      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;

    }
    .detail-card {
      width: min(360px, calc(100% - 32px));
      max-height: min(68vh, 560px);
      overflow-y: auto;
      border-width: 1px;
      border-radius: 18px;
    }
    .detail-name { font-size: 18px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .detail-location-str { display: block; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .detail-perk-box { display: block; border-style: solid; border-color: #eedb9c; }
    .perk-box-title { font-size: 12px; }
    .perk-box-sub { font-size: 12px; }
    .perk-box-value { display: block; margin-top: 8px; font-size: 14px; line-height: 1.55; font-weight: 650; white-space: pre-line; overflow-wrap: anywhere; }
    .detail-desc { font-size: 13px; line-height: 1.55; }
    .detail-btn { min-height: 42px; font-size: 13px; font-weight: 650; }
    .tag-badge { font-size: 12px; padding: 4px 8px; }
    .map-stage { border-width: 1px; border-radius: 20px; }
    .leaflet-tile-pane { filter: saturate(1.45) brightness(1.04); }
    #leafletMap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 350;
      pointer-events: none;
      background: linear-gradient(130deg, rgba(255, 225, 212, 0.18), rgba(215, 241, 233, 0.14) 52%, rgba(230, 222, 249, 0.16));
    }
    .map-paper-overlay { display: none; }
    .leaflet-control-attribution {
      font-size: 9px !important;
      color: #514e5a !important;
      background: rgba(255, 255, 255, 0.9) !important;
    }
    .area-quick-bar { border-width: 1px; border-radius: 15px; }
    .quick-title { font-size: 12px; font-weight: 700; }
    .quick-jump-btn { font-size: 12px; font-weight: 650; padding: 7px 10px; }
    .ctrl-btn { border-width: 1px; border-radius: 12px; box-shadow: 0 2px 6px rgba(53, 57, 71, 0.12); }
    .merchant-sticker-pin { transition: transform 0.16s ease; }
    .merchant-sticker-pin:hover { transform: translate(-50%, -100%) scale(1.08); }
    .pin-bubble { border: 3px solid #fff; border-radius: 50%; padding: 3px; box-shadow: 0 3px 10px rgba(47, 48, 58, 0.22); }
    .pin-icon { width: 32px; height: 32px; border-radius: 50%; font-size: 18px; background: #fff; }
    .merchant-sticker-pin.category-food .pin-icon { background: #fff0eb; }
    .merchant-sticker-pin.category-drink .pin-icon { background: #e5f5ef; }
    .merchant-sticker-pin.category-fun .pin-icon { background: #efedff; }
    .merchant-sticker-pin.category-life .pin-icon { background: #fff4dc; }
    .merchant-sticker-pin.active .pin-bubble { border-color: var(--cssa-red); box-shadow: 0 0 0 4px rgba(216, 38, 44, 0.2), 0 6px 14px rgba(47, 48, 58, 0.2); }
    .pin-caption { display: none; max-width: 170px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 650; box-shadow: 0 2px 7px rgba(47, 48, 58, 0.15); }
    .merchant-sticker-pin.active .pin-caption,
    .merchant-sticker-pin.show-label .pin-caption { display: block; }
    .pin-sparkle { display: none !important; }
    .merchant-cluster {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 16px;

    .merchant-cluster span { transform: rotate(8deg); }
    .landmark-badge { display: inline-block; padding: 5px 10px; color: #433b42; font-size: 13px; font-weight: 750; border: 1px solid #fff; border-radius: 10px 13px 10px 12px; box-shadow: 0 2px 5px rgba(47, 48, 58, 0.12); background: #fff; white-space: nowrap; }
    .landmark-badge.major { padding: 7px 12px; font-size: 15px; border-width: 2px; box-shadow: 0 3px 8px rgba(47, 48, 58, 0.15); }
    .landmark-badge.vancouver { background: #ffede6; border-color: #f5c7b5; color: #915146; }
    .landmark-badge.richmond { background: #fff4db; border-color: #efd596; color: #82602b; }
    .landmark-badge.burnaby { background: #f0edff; border-color: #d7cef2; color: #5f568e; }
    .landmark-badge.ubc { background: #e5f5ef; border-color: #b9dfd2; color: #397563; }
    .landmark-badge.airport { background: #e9f1fd; border-color: #bfd2ed; color: #476488; }
    .landmark-badge.local { padding: 4px 8px; font-size: 12px; background: rgba(255,255,255,.94); border-color: #e8d7c6; }
    .map-hint-pill { display: flex; align-items: center; gap: 9px; font-size: 12px; border-style: solid; background: rgba(255, 255, 255, 0.96); }
    .map-legend-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .map-legend-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
    .map-legend-dot.food { background: var(--pin-food); }
    .map-legend-dot.drink { background: var(--pin-drink); }

    .empty-state {

    @media (max-width: 860px) {
      body { height: 100dvh; overflow: hidden; }

      .brand-title-mobile { display: inline !important; }
      .brand-info .tagline { gap: 0; margin-top: 2px; white-space: nowrap; font-size: 10px; }
      .brand-info .tagline > span:first-child { display: none; }
      .brand-info .tagline span.pill { padding: 2px 6px; font-size: 9px; }
      .header-actions { flex: 0 0 auto; gap: 6px; }

      .chip-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }

      .area-quick-bar { max-width: calc(100% - 64px); overflow-x: auto; }

<body>

  <main class="page">
    <!-- Header -->
    <header class="site-header">
      <div class="brand-wrap">

            <input type="search" id="searchInput" placeholder="搜店名、英文名、区域、类型或优惠…" aria-label="搜索店名、英文名、区域、类型或优惠">

        <!-- Filter 1: Categories -->

        "address": "140-8171 Ackroyd Rd, Richmond, BC V6X 3K1",
        "lat": 49.17276,
        "lng": -123.13518
    },
    {
        "id": "partner_30",
        "name": "桃花坞 Lovin Tea",
        "area": "richmond",
        "areaLabel": "Richmond",
        "category": "drink",
        "icon": "🧋",
        "perk": "麻将 $20/人，全天任打；另享 10% off",
        "shortPerk": "麻将 $20/人",
        "tags": [
            "Richmond"
        ],
        "desc": "UBC CSSA 官方合作商家。凭会员卡享：麻将 $20/人，全天任打；另享 10% off。地址：2040 Hazelbridge Way, Richmond, BC V6X 1E4。",
        "address": "2040 Hazelbridge Way, Richmond, BC V6X 1E4",
        "lat": 49.1848,
        "lng": -123.1332
    }
];

    // Show only the larger English place names at overview zoom; local hubs appear after zooming in.
    const landmarks = [
      { name: "Vancouver", lat: 49.2900, lng: -123.1390, level: "major", tone: "vancouver" },
      { name: "Richmond", lat: 49.1665, lng: -123.1510, level: "major", tone: "richmond" },
      { name: "Burnaby", lat: 49.2390, lng: -123.0160, level: "major", tone: "burnaby" },
      { name: "UBC", lat: 49.2680, lng: -123.2550, level: "major", tone: "ubc" },
      { name: "YVR Airport", lat: 49.2040, lng: -123.1710, level: "major", tone: "airport" },
      { name: "Surrey", lat: 49.1825, lng: -122.8460, level: "major", tone: "richmond" },
      { name: "Coquitlam", lat: 49.2830, lng: -122.7930, level: "major", tone: "burnaby" },
      { name: "Langley", lat: 49.1040, lng: -122.6600, level: "major", tone: "vancouver" },
      { name: "Broadway", lat: 49.2640, lng: -123.1760, level: "local", tone: "vancouver" },
      { name: "Downtown", lat: 49.2840, lng: -123.1200, level: "local", tone: "vancouver" },
      { name: "Alexandra Rd", lat: 49.1795, lng: -123.1280, level: "local", tone: "richmond" },
      { name: "Metrotown", lat: 49.2250, lng: -123.0030, level: "local", tone: "burnaby" },
      { name: "Richmond Centre", lat: 49.1660, lng: -123.1360, level: "local", tone: "richmond" }
    ];

    // 2. Application State
    const state = {
      category: "all",
      area: "all",
      query: "",
      selectedId: null
    };

    // DOM Elements
    const partnerList = document.getElementById("partnerList");
    const partnerCount = document.getElementById("partnerCount");
    const searchInput = document.getElementById("searchInput");
    const detailCard = document.getElementById("detailCard");
    const sidebarSheet = document.getElementById("sidebarSheet");
    const drawerHandle = document.getElementById("drawerHandle");
    const drawerToggleText = document.getElementById("drawerToggleText");
    const appToast = document.getElementById("appToast");
    let toastTimer = null;

    // 3. Initialize Leaflet Real Map
    const map = L.map("leafletMap", {
      center: [49.2350, -123.1250],
      zoom: 11,
      minZoom: 10,
      maxZoom: 18,
      zoomControl: false,
      attributionControl: true
    });

    // Keep roads and terrain colors while drawing only our curated place labels on top.
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: 'Tiles &copy; Esri &mdash; Sources: Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community',
      maxZoom: 19
    }).addTo(map);

    const coreBounds = L.latLngBounds([[49.158, -123.265], [49.300, -122.958]]);
    const outerAreaIds = new Set(["langley", "surrey", "coquitlam"]);
    const outerBounds = L.latLngBounds(partners.filter(p => outerAreaIds.has(p.area) && p.lat && p.lng).map(p => [p.lat, p.lng]));
    const allStoreBounds = L.latLngBounds(partners.filter(p => p.lat && p.lng).map(p => [p.lat, p.lng]));

    // Store markers, pastel district accents, and curated place labels.
    const markerGroup = L.layerGroup().addTo(map);
    const districtGroup = L.layerGroup().addTo(map);
    const landmarkGroup = L.layerGroup().addTo(map);
    let markerInstances = {};

    const districtGlows = [
      { lat: 49.2815, lng: -123.1250, radius: 3300, color: "#ed8b79" },
      { lat: 49.1790, lng: -123.1350, radius: 3000, color: "#e7b74e" },
      { lat: 49.2280, lng: -123.0030, radius: 2700, color: "#927ddb" },
      { lat: 49.2606, lng: -123.2460, radius: 2500, color: "#51aa9b" }
    ];
    districtGlows.forEach(area => L.circle([area.lat, area.lng], {
      radius: area.radius,
      color: area.color,
      weight: 2,
      opacity: 0.5,
      dashArray: "5 8",
      fillColor: area.color,
      fillOpacity: 0.28,
      interactive: false
    }).addTo(districtGroup));

    function renderLandmarks() {
      landmarkGroup.clearLayers();
      const zoom = map.getZoom();
      const visibleBounds = map.getBounds().pad(0.08);
      const level = zoom < 13.5 ? "major" : "local";
      const coreNames = new Set(["Vancouver", "Richmond", "Burnaby", "UBC", "YVR Airport"]);
      const isCoreView = coreBounds.contains(map.getCenter());
      landmarks.filter(lm => lm.level === level && (level !== "major" || !isCoreView || coreNames.has(lm.name)) && visibleBounds.contains([lm.lat, lm.lng])).forEach(lm => {
        const icon = L.divIcon({
          className: "custom-leaflet-marker",
          html: `<div class="landmark-badge ${lm.level} ${lm.tone}">${lm.name}</div>`,
          iconSize: [0, 0]
        });
        L.marker([lm.lat, lm.lng], { icon, interactive: false, zIndexOffset: 1200 }).addTo(landmarkGroup);
      });
    }

    // 5. Create Sticker Icon for a Partner
    function createStickerIcon(partner, isActive, showLabel) {
      return L.divIcon({
        className: "custom-leaflet-marker",
        html: `
          <div class="merchant-sticker-pin category-${partner.category} ${isActive ? "active" : ""} ${showLabel ? "show-label" : ""}" data-id="${partner.id}">
            <div class="pin-sparkle">✦</div>
            <div class="pin-bubble">
              <div class="pin-icon">${partner.icon}</div>
            </div>
            <div class="pin-tail"></div>
            <div class="pin-caption">${partner.name}</div>
          </div>
        `,
        iconSize: [0, 0]
      });
    }

    function createClusterIcon(group) {
      const categoryCounts = group.reduce((counts, p) => {
        counts[p.category] = (counts[p.category] || 0) + 1;
        return counts;
      }, {});
      const dominantCategory = Object.keys(categoryCounts).sort((a, b) => categoryCounts[b] - categoryCounts[a])[0];
      const colors = { food: "#e87864", drink: "#4ba99b", fun: "#8a76d5", life: "#d49a36" };
      const icon = L.divIcon({
        className: "custom-leaflet-marker",
        html: `<div class="merchant-cluster" style="--cluster-color:${colors[dominantCategory] || "#d8262c"}" aria-label="${group.length} 家店"><span>${group.length}</span></div>`,
        iconSize: [44, 48],
        iconAnchor: [22, 38]
      });
      const center = L.latLng(
        group.reduce((sum, p) => sum + p.lat, 0) / group.length,
        group.reduce((sum, p) => sum + p.lng, 0) / group.length
      );
      const marker = L.marker(center, { icon, title: `${group.length} 家合作店` });
      marker.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        const bounds = L.latLngBounds(group.map(p => [p.lat, p.lng]));
        if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
          map.flyTo(center, Math.min(17, map.getZoom() + 2), { duration: 0.65 });
        } else {
          map.flyToBounds(bounds, { padding: [64, 64], maxZoom: 16, duration: 0.65 });
        }
      });
      marker.addTo(markerGroup);
    }

    function renderMarkers(visible) {
      markerGroup.clearLayers();
      markerInstances = {};
      const zoom = map.getZoom();
      const mapBounds = map.getBounds().pad(0.12);
      const nearby = visible.filter(p => p.lat && p.lng && mapBounds.contains([p.lat, p.lng]));
      const groups = new Map();

      nearby.forEach(p => {
        const point = map.latLngToContainerPoint([p.lat, p.lng]);
        const key = `${Math.floor(point.x / 54)}:${Math.floor(point.y / 54)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      });

      groups.forEach(group => {
        if (group.length > 1 && zoom < 15) {
          createClusterIcon(group);
          return;
        }
        group.forEach(p => {
          const isSel = state.selectedId === p.id;
          const marker = L.marker([p.lat, p.lng], {
            icon: createStickerIcon(p, isSel, isSel || zoom >= 14),
            title: `${p.name} · ${p.shortPerk || p.perk}`,
            zIndexOffset: isSel ? 1000 : 0
          });
          marker.on("click", (e) => {
            L.DomEvent.stopPropagation(e);
            selectPartner(p.id, false);
          });
          marker.addTo(markerGroup);
          markerInstances[p.id] = marker;
        });
      });
    }

    // 6. Filter & Search Logic
    const searchAliasesById = {
      partner_1: ["haidilao", "hai di lao", "hot pot", "火锅", "海底捞"],
      partner_2: ["rumble", "boxing", "拳击", "健身"],
      partner_3: ["from 1%", "from1%", "skin lab", "美容", "护肤", "脱毛", "皮肤管理"],
      partner_4: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_5: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_6: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_7: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_8: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_9: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_10: ["share tea", "sharetea", "bubble tea", "boba", "奶茶", "茶饮"],
      partner_11: ["hakumori", "haku mori", "ubccssa", "ubc cssa", "网店", "护肤"],
      partner_12: ["春芳号", "春芳號", "chun fun how", "chunfunhow", "奶茶"],
      partner_13: ["春芳号", "春芳號", "chun fun how", "chunfunhow", "奶茶"],
      partner_14: ["first bite", "firstbite", "tart", "cake", "蛋挞", "甜点", "烘焙"],
      partner_15: ["tokyo in april", "日料", "日本料理"],
      partner_16: ["slothfuls", "甜品", "dessert"],
      partner_17: ["hot spot buffet", "hotspot", "烧烤", "火锅"],
      partner_18: ["myst", "觅食", "event food", "活动餐食", "团餐"],
      partner_19: ["myst", "觅食", "event food", "活动餐食", "团餐"],
      partner_20: ["myst", "觅食", "event food", "活动餐食", "团餐"],
      partner_21: ["添玺", "the north bistro"],
      partner_22: ["柠记", "柠檬茶", "lemon tea"],
      partner_23: ["wren", "wren cafe", "咖啡"],
      partner_24: ["豆捞坊", "hot pot", "火锅"],
      partner_25: ["duoduo", "酸奶", "yogurt", "酸奶碗"],
      partner_26: ["duoduo", "酸奶", "yogurt", "酸奶碗"],
      partner_27: ["fitbox", "fit box", "低卡", "meal prep", "轻食", "大温配送"],
      partner_28: ["deco nova", "deconova", "ktv", "karaoke", "k歌之王"],
      partner_29: ["v+club", "v+ karaoke", "ktv", "karaoke", "卡拉ok"],
      partner_30: ["lovin tea", "loving tea", "桃花坞", "麻将", "mahjong"]
    };
    const searchTermsByCategory = {
      food: ["美食", "正餐", "餐厅", "restaurant", "dining", "火锅", "food"],
      drink: ["饮品", "奶茶", "茶饮", "甜点", "饮料", "drink", "boba"],
      fun: ["玩乐", "ktv", "卡拉ok", "娱乐", "fun"],
      life: ["生活", "美容", "护肤", "健身", "life"]
    };
    const normalizeSearch = value => String(value || "").normalize("NFKC").toLowerCase().replace(/[.,/()·|_-]+/g, " ").trim();
    const categoryLabel = { food: "美食", drink: "饮品", fun: "玩乐", life: "生活" };

    function getVisiblePartners() {
      const queryTokens = normalizeSearch(state.query).split(/\s+/).filter(Boolean);
      return partners.filter(p => {
        const matchCat = state.category === "all" || p.category === state.category;
        const matchArea = state.area === "all" || p.area === state.area || (state.area === "outer" && outerAreaIds.has(p.area));
        const searchable = normalizeSearch([
          p.name, p.area, p.areaLabel, p.desc, p.perk, p.shortPerk, p.tags.join(" "), p.address,
          searchAliasesById[p.id]?.join(" "), searchTermsByCategory[p.category]?.join(" ")
        ].join(" "));
        const matchQuery = !queryTokens.length || queryTokens.every(token => searchable.includes(token));
        return matchCat && matchArea && matchQuery;
      });
    }

    // 7. Render Function
    function render() {
      const visible = getVisiblePartners();
      partnerCount.textContent = visible.length;

      // Render Left/Drawer Scroll Cards
      partnerList.innerHTML = visible.length ? visible.map(p => `
        <article class="partner-card ${state.selectedId === p.id ? "active" : ""}" data-id="${p.id}" data-category="${p.category}" tabindex="0" role="button" aria-label="${p.name}，${p.perk}">
          <div class="card-icon" aria-hidden="true">${p.icon}</div>
          <div class="card-info">
            <div class="name">${p.name}</div>
            <div class="sub">
              <span class="badge-area">${p.areaLabel.split("·")[0].trim()}</span>
              <span>${p.onlineOnly ? "线上配送" : categoryLabel[p.category]}</span>
            </div>
          </div>
          <div class="card-perk">${p.shortPerk || p.perk}</div>
        </article>
      `).join("") : `
        <div class="empty-state" role="status">
          <div>没有找到匹配的小店</div>
          <button type="button" id="clearFiltersButton">清除搜索和筛选</button>
        </div>`;

      renderMarkers(visible);

      // Bind Click Listeners for Sidebar Cards
      document.querySelectorAll(".partner-card[data-id]").forEach(card => {
        card.addEventListener("click", () => selectPartner(card.dataset.id, true));
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectPartner(card.dataset.id, true);
          }
        });
      });
      document.getElementById("clearFiltersButton")?.addEventListener("click", clearFilters);
    }

    // 8. Select Partner & Open Detail Card
    function selectPartner(id, fromList = false) {
      const p = partners.find(item => item.id === id);
      if (!p) return;

      state.selectedId = id;

      // Update Card UI
      document.getElementById("cardIcon").textContent = p.icon;
      document.getElementById("cardName").textContent = p.name;
      document.getElementById("cardArea").textContent = p.onlineOnly
        ? "🥗 大温配送 · 线上订餐（无实体店）"
        : `📍 ${p.areaLabel} · ${p.address}`;
      document.getElementById("cardPerk").textContent = p.perk.replace(/[；;]/g, "\n");
      document.getElementById("cardDesc").textContent = p.onlineOnly
        ? "提供大温地区线上订餐与配送服务。"
        : "凭有效 UBC CSSA 会员卡享受以上优惠；具体使用条件以店家说明为准。";
      document.getElementById("cardTags").innerHTML = p.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("");

      detailCard.classList.add("open");
      render();

      if (p.lat && p.lng) {
        map.flyTo([p.lat, p.lng], 15, { duration: 0.8, easeLinearity: 0.25 });
      }

      // Mobile Bottom Sheet Handling
      if (window.innerWidth <= 860) {
        sidebarSheet.classList.remove("sheet-expanded");
        sidebarSheet.classList.add("sheet-half");
        updateDrawerText();
      }
    }

    function closeDetail() {
      state.selectedId = null;
      detailCard.classList.remove("open");
      render();
    }

    document.getElementById("btnCloseDetail").addEventListener("click", closeDetail);

    // 9. Quick Area Jump Destinations with Real GPS
    const jumpPresets = {
      core: { bounds: coreBounds, maxZoom: 12.5 },
      ubc: { center: [49.2630, -123.2460], zoom: 15 },
      vancouver: { center: [49.2820, -123.1250], zoom: 14 },
      richmond: { center: [49.1790, -123.1330], zoom: 14 },
      burnaby: { center: [49.2290, -123.0030], zoom: 14 },
      outer: { bounds: outerBounds, maxZoom: 11.6 },
      all: { bounds: allStoreBounds, maxZoom: 10.8 }
    };

    document.querySelectorAll("[data-jump]").forEach(btn => {
      btn.addEventListener("click", () => {
        const dest = btn.dataset.jump;
        if (jumpPresets[dest]) {
          flyToPreset(dest);
          showToast(`已飞向: ${btn.textContent.trim()}`);
        }
      });
    });

    function flyToPreset(dest) {
      const preset = jumpPresets[dest];
      if (!preset) return;
      if (preset.bounds) {
        map.flyToBounds(preset.bounds, { padding: [48, 48], maxZoom: preset.maxZoom, duration: 0.9 });
      } else {
        map.flyTo(preset.center, preset.zoom, { duration: 0.9 });
      }
    }

    // Zoom Controls
    document.getElementById("btnZoomIn").addEventListener("click", () => map.zoomIn());
    document.getElementById("btnZoomOut").addEventListener("click", () => map.zoomOut());
    document.getElementById("btnResetView").addEventListener("click", () => {
      flyToPreset("core");
      showToast("已回到温哥华、列治文、本拿比核心商圈 ✦");
    });

    // 10. Filter Chips Events
    document.querySelectorAll("[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.category = btn.dataset.cat;
        document.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
        document.getElementById("activeCategoryHint").textContent = btn.textContent.trim();
        render();
      });
    });

    document.querySelectorAll("[data-area]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.area = btn.dataset.area;
        document.querySelectorAll("[data-area]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
        render();
        const preset = jumpPresets[state.area];
        if (preset) flyToPreset(state.area);
      });
    });

    // 11. Search Input
    searchInput.addEventListener("input", (e) => {
      state.query = e.target.value;
      render();
    });

    function clearFilters() {
      state.query = "";
      state.category = "all";
      state.area = "all";
      searchInput.value = "";
      document.querySelectorAll("[data-cat]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.cat === "all")));
      document.querySelectorAll("[data-area]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.area === "all")));
      document.getElementById("activeCategoryHint").textContent = "全部类型";
      render();
      flyToPreset("core");
    }

    map.on("moveend zoomend", () => {
      renderMarkers(getVisiblePartners());
      renderLandmarks();
    });

    // 12. Mobile Bottom Sheet Interactions
    function updateDrawerText() {
      if (sidebarSheet.classList.contains("sheet-expanded")) {
        drawerToggleText.innerHTML = "<span>▼ 点击或下滑查看地图</span>";
      } else {
        drawerToggleText.innerHTML = "<span>▲ 点击或上滑展开商家列表</span>";
      }
    }

    drawerHandle.addEventListener("click", () => {
      if (sidebarSheet.classList.contains("sheet-expanded")) {
        sidebarSheet.classList.remove("sheet-expanded");
        sidebarSheet.classList.remove("sheet-half");
      } else {
        sidebarSheet.classList.add("sheet-expanded");
        sidebarSheet.classList.remove("sheet-half");
      }
      updateDrawerText();
    });

    // 13. Toast & Dialogs
    function showToast(msg) {
      appToast.textContent = msg;
      appToast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        appToast.classList.remove("show");
      }, 2400);
    }

    document.getElementById("btnHowToCard").addEventListener("click", () => {
      showToast("💳 UBC CSSA 会员可在微信公众号/小程序或迎新现场领取实体卡与电子码。");
    });

    document.getElementById("btnSuggest").addEventListener("click", () => {
      showToast("✎ 欢迎私信 UBC CSSA 商务部推荐你最想打折的大温宝藏小店！");
    });

    document.getElementById("btnNavMaps").addEventListener("click", () => {
      if (!state.selectedId) return;
      const p = partners.find(item => item.id === state.selectedId);
      if (p.onlineOnly || !p.lat || !p.lng) {
        showToast("FitBox 提供大温配送，没有实体店导航地址。");
        return;
      }
      showToast(`📍 正在调用 Google Maps 导航前往：${p.name}`);
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`, "_blank");
    });

    document.getElementById("btnHowToUse").addEventListener("click", () => {
      showToast("✨ 到店点单结账前，向店员出示有效的 UBC CSSA 会员卡即可立享优惠！");
    });

    // Close on ESC
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDetail();
    });

    // Start on the Vancouver, Richmond, Burnaby, and UBC core; the full partner set stays searchable.
    render();
    map.fitBounds(coreBounds, { padding: [42, 42], maxZoom: 12.4 });
    renderLandmarks();
  </script>
</body>
</html>
